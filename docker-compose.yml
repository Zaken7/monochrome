version: "3.8"

services:
  monochrome:
    image: zaken7/monochrome:latest
    container_name: monochrome
    restart: unless-stopped
    ports:
      - "8173:5173"
    volumes:
      - ./data/music:/app/data/music
    user: "1001:1001"  # Run as nodejs user for proper permissions
    environment:
      - NODE_ENV=production
      - SERVER_DOWNLOAD=ENABLED
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
